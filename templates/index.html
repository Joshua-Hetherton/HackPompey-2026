<!DOCTYPE html>
<html>
    <head>
        <title>Styx Market</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../frontend/css/main.css"> 

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">

        
        
    </head>


<body>
    <!-- -- Navigation bar+title -- -->
    <header class="title-bar">
        <nav class="market-controls" aria-label="Market controls">
            <div class="control-group category-controls" role="group" aria-label="Stock category">
                <button class="market-control is-active" type="button" data-category="tech" aria-pressed="true">Tech</button>
                <button class="market-control" type="button" data-category="finance" aria-pressed="false">Finance</button>
                <button class="market-control" type="button" data-category="energy" aria-pressed="false">Energy</button>
                <button class="market-control" type="button" data-category="crypto" aria-pressed="false">Crypto</button>
            </div>
            <div class="control-group timeframe-controls" role="group" aria-label="Performance timeframe">
                <button class="market-control is-active" type="button" data-timeframe="1d" aria-pressed="true">1D</button>
                <button class="market-control" type="button" data-timeframe="2d" aria-pressed="false">2D</button>
                <button class="market-control" type="button" data-timeframe="1w" aria-pressed="false">1W</button>
                <button class="market-control" type="button" data-timeframe="1y" aria-pressed="false">1Y</button>
            </div>
        </nav>
        <h1>Styx Market</h1>
    </header>

    <!-- Crossing: pay the ferryman, then sail into the underworld -->
    <section id="crossing" class="crossing" data-image="../frontend/assets/images/styxcrossing.jpg" data-block="8">
        <p class="crossing-prompt">Click the coin to pay the ferryman and cross into the market.</p>
        <div class="crossing-water" aria-hidden="true"></div>
        <button id="coin" class="coin" type="button" aria-label="Pay Charon the ferryman">
            <img src="../frontend/assets/images/coin.png" alt="">
        </button>
        <img id="rowboat" class="rowboat" src="../frontend/assets/images/rowboat.png" alt="Charon the ferryman in his rowing boat">
        <button id="skip-crossing" class="skip" type="button">Skip</button>
    </section>

    <main class="greek-underworld">
        <p id="status" class="status" role="status" hidden></p>


        <!-- data-image="../frontend/images/elysium.jpg" -->
        <section id="elysium" class="tier tier-elysium" data-tier="elysium" data-image="../frontend/assets/images/panorama-with-the-abduction-of-helen-amidst-maarten-van-heemskerck.jpg" data-block="8">
            <h2>Elysium</h2>
            <p>Best performers this month</p>
        </section>  

        <div class="transition-layer"></div>

        <section id="asphodel" class="tier tier-asphodel" data-tier="asphodel" data-image="../frontend/assets/images/asphodel_picture.jpg" data-block="8">
            <h2>Asphodel</h2>
            <p>Holding steady</p>
        </section>  

        <div class="transition-layer"></div>

        <section id="fields-of-punishment" class="tier tier-punishment" data-tier="punishment" data-image="../frontend/assets/images/the-destruction-of-pompeii-and-herculaneum-john-martin.jpg" data-block="6">
            <h2>Fields of Punishment</h2>
            <p>Struggling</p>
        </section>

        <div class="transition-layer"></div>

        <section id="tartarus" class="tier tier-tartarus" data-tier="tartarus" data-image="../frontend/assets/images/an-eruption-hawaii-jules-tavernier.jpg" data-block="7">
            <h2>Tartarus</h2>
            <p>The Bottom performers</p>
        </section>

        <div id="stock-layer" class="stock-layer"></div>
        


    </main>

    <!-- Factory template for stock icons/items -->

    <template id="stock-template">
        <button class="stock-item" type="button">
            <span class="stock-identifier"></span>
            <span class="stock-change"></span>
            <span class="stock-bubble">
                <strong class="bubble-text"></strong>
                <span class="bubble-movement"></span>
            </span>
        </button>
    </template>

    <script src="../frontend/js/pixelate.js"></script>
     <script src="../frontend/js/stock.js"></script>
    <script src="../frontend/js/styx-crossing.js"></script>
</body>
