<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STYX // Underworld Market Test Bench</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Courier New", monospace;
      background: #0e0e14;
      color: #e8e8f0;
      margin: 0;
      padding: 20px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid #2a2a3a;
      padding-bottom: 14px;
      margin-bottom: 16px;
    }
    h1 { margin: 0; font-size: 22px; color: #ffd700; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }
    .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
    button {
      background: #1d1d2b;
      color: #e8e8f0;
      border: 2px solid #3d3d56;
      padding: 8px 14px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 13px;
    }
    button:hover { border-color: #ffd700; }
    button.active { background: #3b3520; border-color: #ffd700; color: #ffd700; }
    input[type="text"] {
      background: #161622;
      color: #fff;
      border: 2px solid #3d3d56;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 13px;
      min-width: 180px;
    }

    #status-bar {
      padding: 10px 14px;
      background: #171724;
      border-left: 4px solid #ffd700;
      margin-bottom: 18px;
      font-size: 13px;
    }
    #status-bar.error {
      border-left-color: #ff3b3b;
      background: #2a1418;
      color: #ff9c9c;
    }

    .realms {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }
    .realm {
      border: 2px solid #333;
      border-radius: 6px;
      padding: 14px;
      min-height: 180px;
    }
    .realm-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .realm h2 { margin: 0; font-size: 16px; }
    .count-badge {
      background: rgba(255,255,255,0.1);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
    }

    #elysium { border-color: #ffd700; background: #1d1b10; }
    #elysium h2 { color: #ffd700; }
    #asphodel { border-color: #8b8b9e; background: #171720; }
    #asphodel h2 { color: #c4c4d4; }
    #fields-of-punishment { border-color: #ff8c00; background: #211710; }
    #fields-of-punishment h2 { color: #ff9d2e; }
    #tartarus { border-color: #ff3b3b; background: #221114; }
    #tartarus h2 { color: #ff5c5c; }

    .stock-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .stock-card {
      background: #14141f;
      border: 1px solid #44445a;
      padding: 8px 10px;
      border-radius: 4px;
      cursor: pointer;
      min-width: 115px;
      transition: transform 0.1s, border-color 0.1s;
    }
    .stock-card:hover {
      transform: translateY(-2px);
      border-color: #ffd700;
    }
    .stock-symbol { font-weight: bold; font-size: 14px; }
    .stock-price { font-size: 12px; color: #bbb; margin-top: 2px; }
    .stock-pct { font-size: 12px; font-weight: bold; margin-top: 4px; }
    .pos { color: #4dff88; }
    .neg { color: #ff5c5c; }

    #tooltip {
      position: fixed;
      display: none;
      background: #0b0b12;
      border: 2px solid #ffd700;
      padding: 12px;
      width: 280px;
      pointer-events: none;
      z-index: 1000;
      font-size: 13px;
      line-height: 1.45;
      box-shadow: 0 6px 20px rgba(0,0,0,0.7);
    }
    .tip-title { font-size: 15px; font-weight: bold; color: #ffd700; }
    .tip-status { color: #a7c7ff; font-style: italic; margin: 4px 0; }
    .tip-stats {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #333;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>STYX // Underworld Market Test Bench</h1>
    <button id="refresh-btn">Refresh Data</button>
  </header>

  <div class="toolbar">
    <div class="btn-group" id="category-buttons">
      <button data-cat="tech" class="active">Tech</button>
      <button data-cat="finance">Finance</button>
      <button data-cat="energy">Energy</button>
      <button data-cat="crypto">Crypto</button>
    </div>

    <div class="btn-group" id="timeframe-buttons">
      <button data-tf="1d" class="active">1D</button>
      <button data-tf="1w">1W</button>
      <button data-tf="1y">1Y</button>
    </div>

    <input type="text" id="search-input" placeholder="Filter ticker (e.g. NVDA)..." />
  </div>

  <div id="status-bar">Connecting to Flask backend...</div>

  <div class="realms">
    <section class="realm" id="elysium">
      <div class="realm-header">
        <h2>Elysium (≥ +1%)</h2>
        <span class="count-badge">0</span>
      </div>
      <div class="stock-list"></div>
    </section>

    <section class="realm" id="asphodel">
      <div class="realm-header">
        <h2>Asphodel (0% to &lt; +1%)</h2>
        <span class="count-badge">0</span>
      </div>
      <div class="stock-list"></div>
    </section>

    <section class="realm" id="fields-of-punishment">
      <div class="realm-header">
        <h2>Fields of Punishment (&gt; -1% to &lt; 0%)</h2>
        <span class="count-badge">0</span>
      </div>
      <div class="stock-list"></div>
    </section>

    <section class="realm" id="tartarus">
      <div class="realm-header">
        <h2>Tartarus (≤ -1%)</h2>
        <span class="count-badge">0</span>
      </div>
      <div class="stock-list"></div>
    </section>
  </div>

  <div id="tooltip"></div>

  <script>
    // Use the current origin when served by Flask; otherwise target Flask on port 9000.
    const API_BASE =
      window.location.port === "9000" ? "" : "http://127.0.0.1:9000";

    const REALM_IDS = ["elysium", "asphodel", "fields-of-punishment", "tartarus"];
    const statusBar = document.getElementById("status-bar");
    const tooltip = document.getElementById("tooltip");
    const searchInput = document.getElementById("search-input");

    let currentCategory = "tech";
    let currentTimeframe = "1d";
    let loadedSouls = [];

    function setStatus(msg, isError = false) {
      statusBar.textContent = msg;
      statusBar.className = isError ? "error" : "";
    }

    function formatPct(val) {
      return `${val > 0 ? "+" : ""}${val}%`;
    }

    function renderStocks() {
      const query = searchInput.value.trim().toUpperCase();
      const counts = { "elysium": 0, "asphodel": 0, "fields-of-punishment": 0, "tartarus": 0 };

      REALM_IDS.forEach(id => {
        document.querySelector(`#${id} .stock-list`).innerHTML = "";
      });

      const filtered = loadedSouls.filter(s => s.symbol.toUpperCase().includes(query));

      filtered.forEach(stock => {
        const container = document.querySelector(`#${stock.id} .stock-list`);
        if (!container) return;

        counts[stock.id]++;
        const pctKey = `pct_change_${currentTimeframe}`;
        const pctVal = stock[pctKey];

        const card = document.createElement("div");
        card.className = "stock-card";
        card.innerHTML = `
          <div class="stock-symbol">${stock.symbol}</div>
          <div class="stock-price">$${stock.price}</div>
          <div class="stock-pct ${pctVal >= 0 ? "pos" : "neg"}">
            ${currentTimeframe.toUpperCase()}: ${formatPct(pctVal)}
          </div>
        `;

        card.addEventListener("mouseenter", () => {
          const statusText = stock.current_status || stock.status_title || "No status";
          const loreText = stock.fun_lore || stock.tooltip_lore || "No lore available.";

          tooltip.innerHTML = `
            <div class="tip-title">${stock.symbol} — $${stock.price}</div>
            <div class="tip-status">${statusText}</div>
            <div>${loreText}</div>
            <div class="tip-stats">
              <span>1D: ${formatPct(stock.pct_change_1d)}</span>
              <span>1W: ${formatPct(stock.pct_change_1w)}</span>
              <span>1Y: ${formatPct(stock.pct_change_1y)}</span>
            </div>
          `;
          tooltip.style.display = "block";
        });

        card.addEventListener("mousemove", (e) => {
          const x = Math.min(e.clientX + 16, window.innerWidth - 300);
          const y = Math.min(e.clientY + 16, window.innerHeight - 160);
          tooltip.style.left = `${x}px`;
          tooltip.style.top = `${y}px`;
        });

        card.addEventListener("mouseleave", () => {
          tooltip.style.display = "none";
        });

        container.appendChild(card);
      });

      REALM_IDS.forEach(id => {
        document.querySelector(`#${id} .count-badge`).textContent = counts[id];
      });
    }

    async function loadCategory(category) {
      currentCategory = category;
      setStatus(`Fetching "${category}" souls from ${API_BASE || window.location.origin}/api/market/${category}...`);

      try {
        const res = await fetch(`${API_BASE}/api/market/${category}`);
        if (!res.ok) {
          throw new Error(`HTTP ${res.status} (${res.statusText})`);
        }
        const data = await res.json();
        loadedSouls = data.souls || [];
        renderStocks();
        setStatus(`Loaded ${loadedSouls.length} stocks in "${data.category}". Hover over any card to inspect its tooltip.`);
      } catch (err) {
        loadedSouls = [];
        renderStocks();
        setStatus(
          `Error loading backend: ${err.message}. Make sure "python app.py" is running in your terminal.`,
          true
        );
      }
    }

    // Wire up Category buttons
    document.querySelectorAll("#category-buttons button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#category-buttons button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        loadCategory(btn.dataset.cat);
      });
    });

    // Wire up 1D / 1W / 1Y buttons
    document.querySelectorAll("#timeframe-buttons button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#timeframe-buttons button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentTimeframe = btn.dataset.tf;
        renderStocks();
      });
    });

    // Wire up Search & Refresh
    searchInput.addEventListener("input", renderStocks);
    document.getElementById("refresh-btn").addEventListener("click", () => loadCategory(currentCategory));

    // Initial load
    loadCategory(currentCategory);
  </script>
</body>
</html>
